<!DOCTYPE html>
<html>
<head>
  <title>Part 2</title>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="style.css">
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>
<nav>
  <a href="index.html">Part 1: Setup &amp; Selectors</a>
  <a href="part2.html">Part 2: Effects</a>
  <a href="part3.html">Part 3: DOM</a>
  <a href="part4.html">Part 4: Animations</a>
  <a href="part5.html">Part 5: Mini Project</a>
</nav>
<div class="container">

  <div class="task">
    <h2>Task 2. Visibility Methods</h2>
    <p id="text">Hello! I can hide and show.</p>
    <button id="hideBtn">Hide</button>
    <button id="showBtn">Show</button>
    <button id="toggleBtn">Toggle</button>
  </div>

  <div class="task">
    <h2>Task 3. Fade Methods</h2>
    <button id="fadeInBtn">Fade In</button>
    <button id="fadeOutBtn">Fade Out</button>
    <button id="fadeToggleBtn">Fade Toggle</button><br>
    <img id="photo" src="https://picsum.photos/id/10/300/200" alt="photo">
  </div>

  <div class="task">
    <h2>Task 4. Slide Methods</h2>
    <button id="slideDownBtn">Slide Down</button>
    <button id="slideUpBtn">Slide Up</button>
    <button id="slideToggleBtn">Slide Toggle</button>
    <div class="panel" id="panel">This is a collapsible panel.</div>
  </div>

</div>

<script>
  $(document).ready(function () {
    // Task 2
    $("#hideBtn").click(function () { $("#text").hide(); });
    $("#showBtn").click(function () { $("#text").show(); });
    $("#toggleBtn").click(function () { $("#text").toggle(); });

    // Task 3
    $("#fadeInBtn").click(function () { $("#photo").fadeIn(); });
    $("#fadeOutBtn").click(function () { $("#photo").fadeOut(); });
    $("#fadeToggleBtn").click(function () { $("#photo").fadeToggle(); });

    // Task 4
    $("#slideDownBtn").click(function () { $("#panel").slideDown(); });
    $("#slideUpBtn").click(function () { $("#panel").slideUp(); });
    $("#slideToggleBtn").click(function () { $("#panel").slideToggle(); });
  });
</script>
</body>
</html>
