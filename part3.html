<!DOCTYPE html>
<html>
<head>
  <title>Part 3</title>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="style.css">
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>
<nav>
  <a href="index.html">Part 1: Setup &amp; Selectors</a>
  <a href="part2.html">Part 2: Effects</a>
  <a href="part3.html">Part 3: DOM</a>
  <a href="part4.html">Part 4: Animations</a>
  <a href="part5.html">Part 5: Mini Project</a>
</nav>
<div class="container">

  <div class="task">
    <h2>Task 5. Add &amp; Remove Elements</h2>
    <button id="addBtn">Add Item (end)</button>
    <button id="addFirstBtn">Add Item (start)</button>
    <button id="removeBtn">Remove Item</button>
    <ul id="list">
      <li>Item 1</li>
      <li>Item 2</li>
    </ul>
  </div>

  <div class="task">
    <h2>Task 6. Modifying Attributes</h2>
    <button id="changeImg">Change Image</button>
    <button id="changeLink">Change Link</button><br>
    <img id="img" src="https://picsum.photos/id/20/300/200" alt="image"><br>
    <a id="link" href="https://www.google.com" target="_blank">Go to link</a>
  </div>

  <div class="task">
    <h2>Task 7. Form Interaction</h2>
    <form id="myForm">
      <input type="text" id="name" placeholder="Name"><br>
      <input type="email" id="email" placeholder="Email">
    </form>
    <p>Name: <span id="showName"></span></p>
    <p>Email: <span id="showEmail"></span></p>
  </div>

</div>

<script>
  $(document).ready(function () {
    // Task 5
    var count = 2;
    $("#addBtn").click(function () {
      count++;
      $("#list").append("<li>Item " + count + "</li>");   // add to end
    });
    $("#addFirstBtn").click(function () {
      count++;
      $("#list").prepend("<li>Item " + count + "</li>");  // add to start
    });
    $("#removeBtn").click(function () {
      $("#list li:last").remove();                        // remove last item
    });

    // Task 6: .attr() changes attributes
    $("#changeImg").click(function () {
      $("#img").attr("src", "https://picsum.photos/id/30/300/200");
    });
    $("#changeLink").click(function () {
      $("#link").attr("href", "https://jquery.com");
      $("#link").text("Go to jquery.com");
    });

    // Task 7: keyup runs every time the user types
    $("#name").keyup(function () {
      $("#showName").text($("#name").val());
    });
    $("#email").keyup(function () {
      $("#showEmail").text($("#email").val());
    });
  });
</script>
</body>
</html>
